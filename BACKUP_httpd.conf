#
# If you wish httpd to run as a different user or group, you must run
# httpd as that user/group.  If you start the server as root, you should
# ensure the user group you select can read/write all files that httpd
# will access.
#
# If you want to run httpd as a different user or group, you must run
# httpd as that user/group.  If you start the server as root, you should
# ensure the user group you select can read/write all files that httpd
# will access.
#
# <IfModule unixd_module>
# User daemon
# Group daemon
# </IfModule>

# 'Main' server configuration
#
# The directives in this section set up the values used by the 'main'
# server, which responds to any requests that aren't handled by a
# <VirtualHost> definition.  These values also provide defaults for
# any <VirtualHost> containers you may define later in the file.
#
# All of these directives may appear inside <VirtualHost> containers,
# in which case these default settings will be overridden for the
# virtual host being defined.
#

#
# ServerAdmin: Your address, where problems with the server will be
# e-mailed.  This address appears on some server-generated pages, such
# as error documents.  e.g. admin@your-domain.com
#
ServerAdmin postmaster@localhost

#
# ServerName: Allows you to set a host name which is reflected in the
# server-generated URLs.
#
# The default is www, which is typically what you want. However, if
# you are running a server locally and wish to access it via your
# IP address or hostname rather than just localhost, you might
# specify a different value here.
#
ServerName localhost

#
# ServerSignature: The server adds a footer to server-generated pages
# containing the server version and server name. This is useful for
# debugging. Set to "EMail" to include an email link. Set to "Off" to disable.
#
ServerSignature On

#
# DocumentRoot: The directory out of which you will serve your
# documents. By default, all requests are taken from this directory, but
# symbolic links and aliases may be used to point to other locations.
#
DocumentRoot "C:/xampp/htdocs"

#
# Each directory to which Apache has access can be individually configured
# with respect to what services and features are allowed and/or disabled
# in that directory (and its subdirectories).
#
# First, configure the "default" to be a very restrictive set of features.
#
<Directory />
    AllowOverride none
    Require all denied
</Directory>

#
# Note that from this point forward you must specifically allow
# particular features to be enabled - so if something's not working as
# you might expect, make sure that you have specifically enabled it
# below.
#

#
# This should be changed to whatever you set DocumentRoot to.
#
<Directory "C:/xampp/htdocs">
    #
    # Possible values for the Options directive are "None", "All",
    # or any combination of:
    #   Indexes Includes FollowSymLinks SymLinksifOwnerMatch ExecCGI MultiViews
    #
    # Options that are commented out should be uncommented when
    # required.
    #
    Options Indexes FollowSymLinks

    #
    # AllowOverride controls what directives may be placed in .htaccess files.
    # It can be "All", "None", or any combination of:
    #   Options FileInfo AuthConfig Limit
    #
    AllowOverride All

    #
    # Controls who can get stuff from this server.
    #
    Require all granted

    #
    # The following lines prevent .htaccess and .htpasswd files from being
    # viewed through Web clients.
    #
    <Files ".ht*">
        Require all denied
    </Files>
    <Files ".ht*">
        Require all denied
    </Files>
</Directory>

#
# DirectoryIndex: sets the file that Apache will serve if a directory
# is requested.
#
<IfModule dir_module>
    DirectoryIndex index.php index.pl index.html index.htm index.shtml index.cgi default.asp default.aspx default.html
</IfModule>

#
# The following lines prevent .htaccess and .htpasswd files from being
# viewed by Web clients.
#
<Files ".ht*">
    Require all denied
</Files>
<Files ".ht*">
    Require all denied
</Files>

#
# ErrorLog: The location of the error log file.
# If you do not specify an ErrorLog directive within a <VirtualHost>
# container, error messages relating to that virtual host will be
# logged here.  If you do define an ErrorLog directive for a <VirtualHost>
# container, that host's errors will be logged there and not here.
#
ErrorLog "logs/error.log"

#
# LogLevel: Control the number of messages logged to the error_log.
# Possible values include: debug, info, notice, warn, error, crit,
# alert, emerg.
#
LogLevel warn

<IfModule log_config_module>
    #
    # The following directives define some format nicknames for use with
    # the CustomLog directive (see below).
    #
    LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined
    LogFormat "%h %l %u %t \"%r\" %>s %b" common
    LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\" \"%{Cookie}i\"" combined
    LogFormat "%h %l %u %t \"%r\" %>s %b" combined

    #
    # The location and format of the access logfile (Common Logfile Format).
    # If you do not define any access logfiles within a <VirtualHost>
    # container, they will be logged here.  Conversely, if you *do*
    # define per-<VirtualHost> access logfiles, transactions will be
    # logged therein and *not* in this file.
    #
    CustomLog "logs/access.log" combined
</IfModule>

<IfModule alias_module>
    #
    # Redirect: Allows you to tell clients about documents that used to
    # exist in your server's namespace, but do not anymore. The client
    # will make a new request for the document at its new location.
    # Example:
    # Redirect permanent /foo http://www.example.com/bar
    #
    Redirect permanent /foo http://www.example.com/bar
</IfModule>

#
# Document types: setting the default media type and encoding for a
# file extension.
#
<IfModule mime_module>
    TypesConfig conf/mime.types
    AddType application/x-compress .Z
    AddType application/x-gzip .gz
    AddType application/x-bzip2 .bz2
    AddType application/x-xz .xz
</IfModule>

#
# DefaultType: the default media type
#
DefaultType text/html

#
# PHP is a module that gets plugged into the web server to handle
# PHP content.  This section provides basic configuration for PHP
# to work, but does not cover all the configuration options that PHP
# supports.  For more information, see the PHP documentation at
# <http://php.net/manual/en/configuration.php>.
#
<IfModule php_module>
    <FilesMatch "\.php$">
        SetHandler application/x-httpd-php
    </FilesMatch>
</IfModule>

